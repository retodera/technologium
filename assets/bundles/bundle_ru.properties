unit.t-metalstrong.name = Металлстронг
unit.t-metalstrong.description = кринж. хуёво проработан. ждите. кстати, способность хуёво проработана, музыка часто не останавливается после смерти\n\"Когда же ты сдохнешь?\"\n\"[gray]Наносталиний, сынок.[]\"\n\"[gray]Он застывает в момент физического повреждения.[]\"\n\"[gray]Ты не можешь мне навредить, Расколотые![]\"

