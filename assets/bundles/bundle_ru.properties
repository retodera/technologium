 you don't go\nYou'll never shine if you don't glow\n\nHey now, you're an all star\nGet your game on, go play\nHey now, you're a rock star\nGet the show on, get paid\nAnd all that glitters is gold\nOnly shootin' stars break the mold\nAnd all that glitters is gold\nOnly shootin' stars break the mold\n\n\n\nда, у меня был абсолютный ноль причин писать это вручную (без ctrl+c ctrl+v вообще) но я всё равно это сделал. оно того стоило.

#distribution
block.t-metallic-conveyor.name = Металлический конвейер
block.t-metallic-conveyor.description = Перемещает предметы вперёд.

block.t-metallic-junction.name = Металлический перекрёсток
block.t-metallic-junction.description = Пересечение двух конвейерных линий. Принимает предметы с любой стороны и выводит с противоположной.

block.t-metallic-router.name = Металлический маршрутизатор
block.t-metallic-router.description = Равномерно распределяет предметы по всем сторонам.
block.t-metallic-router.details = не делайте роутерчейны. если будете, я вас лично убью...

block.t-metallic-distributor.name = Металлический распределитель
block.t-metallic-distributor.description = Равномерно распределяет предметы по всем сторонам.
block.t-metallic-distributor.details = ...и дистрибьюторчейны не лучше.

block.t-metallic-bridge-conveyor.name = Мостовой металлический конвейер
block.t-metallic-bridge-conveyor.description = Перемещает предметы поверх построек и поверхности.

block.t-metallic-sorter.name = Металлический сортировщик
block.t-metallic-sorter.description = Если вводимый предмет соответствует выбранному, он проходит вперёд, иначе выводится по бокам. Это поведение можно инвертировать нажатием по блоку и затем нажатием по \uE86A.
lsorter.sort = Сортировка: {0}
lsorter.normal = Обычная
lsorter.inverted = Инвертированная
lsorter.showitem = Показывать предмет

block.t-metallic-overflow-gate.name = Металлический избыточный затвор
block.t-metallic-overflow-gate.description = Если передний путь заблокирован, выводит предметы по бокам.

block.t-metallic-underflow-gate.name = Металлический избыточный шлюз
block.t-metallic-underflow-gate.description = Если пути слева и справа заблокированы, выводит предметы вперёд.

block.t-mechanical-driver.name = Механическая катапульта
block.t-mechanical-driver.description = Стреляет пачками предметов в другие катапульты, минуя поверхность. Выстреливаемые пачки могут сталкиваться с вражескими юнитами.

block.t-fused-junction.name = Скрещённый перекрёсток
block.t-fused-junction.description = Скрещение Металлического и Улучшенного жидкостного перекрёстков. Принимает предметы и жидкости с любой стороны и выводит на противоположную.

#liquids
block.t-improved-conduit.name = Оловянный трубопровод
block.t-improved-conduit.description = Перемещает жидкости вперёд. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-junction.name = Оловянный жидкостный перекрёсток
block.t-improved-liquid-junction.description = Пересечение двух трубопроводных линий. Принимает жидкости с любой стороны и выводит с противоположной. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-router.name = Оловянный жидкостный маршрутизатор
block.t-improved-liquid-router.description = Равномерно распределяет жидкости по всем сторонам. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-bridge.name = Оловянный жидкостный мост
block.t-improved-liquid-bridge.description = Перемещает жидкости над постройками и поверхностью. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-container.name = Оловянный жидкостный контейнер
block.t-improved-liquid-container.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-tank.name = Оловянный жидкостный бак
block.t-improved-liquid-tank.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-advanced-conduit.name = Продвинутый трубопровод
block.t-advanced-conduit.description = Перемещает жидкости вперёд. Более термостойкий, чем Оловянный трубопровод.

block.t-advanced-liquid-junction.name = Продвинутый жидкостный перекрёсток
block.t-advanced-liquid-junction.description = Пересечение двух трубопроводных линий. Принимает жидкости с любой стороны и выводит с противоположной. Более термостойкий, чем Оловянный жидкостный перекрёсток.

block.t-advanced-liquid-router.name = Продвинутый жидкостный маршрутизатор
block.t-advanced-liquid-router.description = Равномерно распределяет жидкости по всем сторонам. Более термостойкий, чем Оловянный жидкостный маршрутизатор.

block.t-advanced-liquid-bridge.name = Продвинутый жидкостный мост
block.t-advanced-liquid-bridge.description = Перемещает жидкости над постройками и поверхностью. Более термостойкий, чем Оловянный жидкостный мост.

block.t-advanced-liquid-container.name = Продвинутый жидкостный контейнер
block.t-advanced-liquid-container.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Более термостойкий, чем Оловянный жидкостный контейнер.

block.t-advanced-liquid-tank.name = Продвинутый жидкостный бак
block.t-advanced-liquid-tank.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Более термостойкий, чем Оловянный жидкостный бак.

block.t-improved-liquid-sorter.name = Оловянный жидкостный сортировщик
block.t-improved-liquid-sorter.description = Если вводимая жидкость соответствует выбранной, она проходит вперёд, иначе выводится по бокам. Это поведение можно инвертировать нажатием по блоку и затем нажатием по \uE86A.
block.t-improved-liquid-sorter.details = Абсолютно бесполезно. До какого-то времени. пока я не...\n\n\n[СПОЙЛЕР]\n\n\n\n\n\n...сделаю атмосферный сепаратор.

block.t-liquid-pump.name = Жидкостный насос
block.t-liquid-pump.description = Качает и выводит жидкости. Требует энергию.

#power
block.t-thermal-plate.name = Термальная пластина
block.t-thermal-plate.description = Медленно преобразовывает тепло в энергию.

block.t-thermal-generator.name = Термальный генератор
block.t-thermal-generator.description = Преобразовывает тепло в энергию.

block.t-lithium-combustion-chamber.name = Литиевая камера сгорания
block.t-lithium-combustion-chamber.description = Использует реакцию лития с водой для генерации энергии.

block.t-energetic-node.name = Линия электропередач
block.t-energetic-node.description = Принимает и подаёт энергию на подключенные и примыкающие блоки.

block.t-energetic-node-large.name = Средняя линия электропередач
block.t-energetic-node-large.description = Усовершенствованная ЛЭП, имеющая увеличенные количество и дистанцию подключений.

block.t-lithium-battery.name = Литиевая батарея
block.t-lithium-battery.description = Хранит энергию во время её избытка и выводит во время дефицита.

block.t-large-lithium-battery.name = Большая литиевая батарея
block.t-large-lithium-battery.description = Хранит энергию во время её избытка и выводит во время дефицита.

block.t-cliff-thermal-plate.name = Наскальная термальная пластина
block.t-cliff-thermal-plate.description = Новый уровень бесполезности.

#crafting
block.t-arc-furnace.name = Электродуговая печь
block.t-arc-furnace.description = Переплавляет руды в соответствующие металлы.

block.t-arc-smelter.name = Электродуговая плавильня
block.t-arc-smelter.description = Переплавляет руды в соответствующие металлы. Может сплавливать металлы в сплавы. Эффективнее, чем Электродуговая печь.

block.t-multifunctional-smelter.name = Многофункциональная плавильня
block.t-multifunctional-smelter.description = Улучшенная и увеличенная плавильня. Автоматически выбирает рецепт из выбранной категории на основе входящих предметов и жидкостей.

block.t-item-constructor.name = Предметный конструктор
block.t-item-constructor.description = Создаёт технологии из обычных предметов. Опционально использует воду для увеличения эффективности.

block.t-enricher.name = Обогатитель
block.t-enricher.description = Перерабатывает руды в обогащённые аналоги.

block.t-filter.name = Фильтр
block.t-filter.description = Фильтрует загрязнённые жидкости и минералы из жидкостей/порошка.

block.t-packer.name = Упаковщик
block.t-packer.description = Упаковывает или распаковывает жидкости из консерв.

block.t-training-center.name = Центр обучения
block.t-training-center.description = Наполняет неоплазму знаниями для последующего использования в производстве. Опционально использует воду для увеличения эффективности.
block.t-training-center.details = Восстановленная технология.\n\nПосле нескольких экспериментов, вражеская фракция Каут смогла заставить неоплазму учиться. [#ffffff3f]:skull:[] Неоплазма интегрировалась в простые процессоры, затем механические руки, и наконец, юнитов.\nВсё ещё неизвестно, почему неоплазма сейчас покрывает поверхность Кудола.

block.t-lava-extractor.name = Лавовый экстрактор
block.t-lava-extractor.description = Улучшенный обогатитель для извлечения концентраций металлов из лавы.

#defense
block.t-metallic-wall.name = Металлическая стена
block.t-metallic-wall.description = Простая стена, защищающая постройки от вражеских снарядов.

block.t-metallic-wall-large.name = Большая металлическая стена
block.t-metallic-wall-large.description = Простая стена, защищающая постройки от вражеских снарядов.

block.t-metallic-wall-huge.name = Огромная металлическая стена
block.t-metallic-wall-huge.description = Простая стена, защищающая постройки от вражеских снарядов.

block.t-armored-wall.name = Бронированная стена
block.t-armored-wall.description = Прочная стена, защищающая постройки от вражеских снарядов. Поглощает лазеры.

block.t-armored-wall-large.name = Большая бронированная стена
block.t-armored-wall-large.description = Прочная стена, защищающая постройки от вражеских снарядов. Поглощает лазеры.

block.t-armored-wall-huge.name = Огромная бронированная стена
block.t-armored-wall-huge.description = Прочная стена, защищающая постройки от вражеских снарядов. Поглощает лазеры.

#units
block.t-unit-fabricator.name = Фабрикатор юнитов
block.t-unit-fabricator.description = Производит базовых юнитов. Вывод юнитов может быть осуществлён напрямую, либо перенаправлен в рефабрикаторы.

block.t-metallic-payload-conveyor.name = Металлический грузовой конвейер
block.t-metallic-payload-conveyor.description = Перемещает грузы вперёд.

block.t-large-payload-conveyor.name = Большой грузовой конвейер
block.t-large-payload-conveyor.description = Перемещает грузы вперёд.

block.t-unit-assembler-platform.name = Платформа сборки юнитов
block.t-unit-assembler-platform.description = Центральная часть комплексной мультиблочной конструкции для сборки более мощных боевых единиц.\nДля работы требует впрыскиватели схем, предметов, жидкостей и грузов, а также сборочные башни.\nВместимость предметов может быть повышена присоединением складских модулей.

block.t-schematic-carrier.name = Носитель схем
block.t-schematic-carrier.description = Хранит все данные о схеме боевой единицы. Вставляется в впрыскиватель схем грузовой единицей.

block.t-schematic-injector.name = Впрыскиватель схем
block.t-schematic-injector.description = Необходимая часть для работы сборочной платформы. Впрыскивает схему из подключенного носителя в сборочную платформу, задавая инструкции по сборке.

block.t-item-injector.name = Впрыскиватель предметов
block.t-item-injector.description = Необходимая часть для работы сборочной платформы. Впрыскивает предметы в сборочную платформу.

block.t-liquid-injector.name = Впрыскиватель жидкостей
block.t-liquid-injector.description = Необходимая часть для работы сборочной платформы. Впрыскивает жидкости в сборочную платформу.

block.t-payload-injector.name = Впрыскиватель грузов
block.t-payload-injector.description = Необходимая часть для работы сборочной платформы. Впрыскивает грузы в сборочную платформу.

#effect
block.t-core-torch.name = Ядро: «Факел»
block.t-core-torch.description = Компактное, вместительное, бронированное ядро. После уничтожения весь контакт с сектором теряется.
block.t-core-torch.details = Первая итерация, среди многих. Самовоспроизводящееся.

block.t-core-blaze.name = Ядро: «Пламя»
block.t-core-blaze.description = Усовершенствованное ядро. Больше, более бронированное и вместительное, чем «Факел». Дополнительно извлекает тепло, генерируя энергию.
block.t-core-blaze.details = Вторая итерация.

block.t-metallic-unloader.name = Металлический разгрузчик
block.t-metallic-unloader.description = Разгружает предметы из прилежащих построек.

block.t-metallic-container.name = Металлический контейнер
block.t-metallic-container.description = Хранит небольшое количество предметов. Расширяет хранилище при постановке около ядра. Содержимое может быть извлечено при помощи разгрузчика. 

block.t-metallic-vault.name = Металлическое хранилище
block.t-metallic-vault.description = Хранит большое количество предметов. Расширяет хранилище при постановке около ядра. Содержимое может быть извлечено при помощи разгрузчика.

block.t-mini-mender.name = Малый регенератор
block.t-mini-mender.description = Медленно ремонтирует постройки в радиусе. Опционально использует тёмный металл для увеличения радиуса и эффективности.

block.t-mini-shield-projector.name = Малый проектор щита
block.t-mini-shield-projector.description = Создаёт вокруг себя щит, защищающий постройки и юнитов от повреждений. Перегревается при чрезмерном уроне.\nОпционально использует охлаждающую жидкость для предотвращения перегрева. Генератор щита увеличивает размер и здоровье щита.

block.t-radar.name = Радар
block.t-radar.description = Исследует область вокруг себя. Потребляет энергию.

block.t-long-range-radar.name = Радар дальнего действия
block.t-long-range-radar.description = Исследует область вокруг себя. Имеет больший радиус, чем у обычного радара. Потребляет энергию.

#logic
block.t-switch.name = Переключатель
block.t-switch.description = Переключатель. Состояние может быть прочитано и установлено при помощи процессоров.

block.t-message.name = Сообщение
block.t-message.description = Хранит текстовые сообщения для связи между союзниками и передачи текстовых данных.\nМожет хранить ОЧЕНЬ много символов.

block.t-memory-cell.name = Ячейка памяти
block.t-memory-cell.description = Хранит численные значения для прочитывания и изменения процессорами.

block.t-memory-bank.name = Блок памяти
block.t-memory-bank.description = Хранит численные значения для прочитывания и изменения процессорами. Может хранить в 8 раза больше значений, чем Ячейка памяти.

block.t-energetic-processor.name = Энергетический процессор
block.t-energetic-processor.description = Выполняет последовательность логических инструкций в цикле. Может контроллировать постройки и юнитов.

block.t-plasma-processor.name = Плазменный процессор
block.t-plasma-processor.description = Выполняет последовательность логических инструкций в цикле, но быстрее. И так понятно, что может контроллировать постройки и юнитов. Быстрее, чем Энергетический процессор.

block.t-gamma-processor.name = Гамма-процессор
block.t-gamma-processor.description = Как и прошлые версии, выполняет последовательность логических инструкций в цикле. Вам уже известно, что он может контроллировать постройки и юнитов. Быстрее, чем Плазменный процессор.

block.t-omega-processor.name = Омега-процессор
block.t-omega-processor.description = Ультимативный процессор. Требует гигантское количество энергии для работы.

block.t-borderless-display.name = Безграничный дисплей
block.t-borderless-display.description = Отображает произвольную информацию из процессоров. Никаких границ!

block.t-mini-borderless-display.name = Компактный безграничный дисплей
block.t-mini-borderless-display.description = Отображает произвольную информацию из процессоров. Никаких границ!

block.t-string-memory-cell.name = Строчная ячейка памяти
block.t-string-memory-cell.description = Хранит строчные значения для прочитывания и изменения процессорами.
block.t-string-memory-cell.details = Я всегда этого хотел. Я хотел этого месяцами, может даже год или два. Наконец, я получил то что хотел.

memoryblock.edit = Редактировать
memoryblock.copy = Скопировать
memoryblock.paste = Вставить
memoryblock.rows = Строки
memoryblock.cols = Столбцы

block.t-projector.name = Прожектор
block.t-projector.description = Отображает произвольную информацию из процессоров на указанные координаты, с конфигурируемыми размером проекции и самого дисплея.
block.t-projector.details = Возможно, это не самая лучшая идея ставить кучу проекторов, так как они прогружаются где бы ты ни был. Это сделано, чтобы проекция отображалась даже тогда, когда сам проектор не на экране.

proj-projsize = Размер проекции: 
proj-dispsize = Размер дисплея: 
proj-x = X: 
proj-y = Y: 

#units
unit.t-quant.name = Квант
unit.t-quant.description = Защищает ядро «Факел». Быстро строит и чинит постройки. Оснащён ремонтирующим лучом.

unit.t-lonter.name = Лонтер
unit.t-lonter.description = Защищает ядро «Пламя». Быстро летает, строит и чинит постройки. Оснащён двумя автоматизированными ремонтирующими лучами, чинящими постройки и боевые единицы.

unit.t-cobra.name = Кобра
unit.t-cobra.description = Ползун с снайперской установкой. Страх баз с турелями ближнего действия и/или без регенераторов.

unit.t-python.name = Питон
unit.t-python.description = Обстреливает вражеские базы залпом из артиллерийских снарядов.

unit.t-impaler.name = Пронзатель
unit.t-impaler.description = Стреляет пробивающими рельсами по врагам.

unit.t-blade.name = Клинок
unit.t-blade.description = Выстреливает продолжительный лазерный луч, поджигающий вражеские постройки.

unit.t-saber.name = Сабля
unit.t-saber.description = Сжигает вражеские постройки двумя мощными лазерными установками.

unit.t-napalm.name = Напалм
unit.t-napalm.description = Заряжает мощный продолжительный луч, поджигающий вражеские постройки.
unit.t-napalm.details = - \"У нас кончилось оружие! Несите BFG!\"\n - \"Нет.\"\n - \"Почему?\"\n - \"Я И ЕСТЬ BFG.\"

unit.t-mercury.name = Меркурий
unit.t-mercury.description = Быстро летает, стреляет и уничтожает вражеские постройки и юнитов.

unit.t-mars.name = Марс
unit.t-mars.description = Стреляет залпами пуль по врагам.

unit.t-phobos.name = Фобос
unit.t-phobos.description = Стреляет залпами ракет и двумя пробивающими лазерами по врагам.

unit.t-monopoly.name = Монополия
unit.t-monopoly.description = Скрещение юнитов Моно и Поли. Имеет улучшенную статистику обоих.

unit.t-flarerouterlegs.name = Вспышка роутер на ножках
unit.t-flarerouterlegs.description = "сделайте вспышку роутер на ножках" - кто-то из какого-то тг сервака

