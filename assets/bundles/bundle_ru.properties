#production
block.t-dark-plasma-bore.name = Тёмный плазменный бур
block.t-dark-plasma-bore.description = Копает и выводит руду из стен впереди.

block.t-mini-plasma-bore.name = Мини плазменный бур
block.t-mini-plasma-bore.description = Копает и выводит руду из стен впереди. Миниатюрная версия.

block.t-dark-drill.name = Тёмная дрель
block.t-dark-drill.description = Медленно копает и выводит руду под собой.

block.t-metallic-drill.name = Металлическая дрель
block.t-metallic-drill.description = Копает и выводит руду под собой.

block.t-gold-extractor.name = Экстрактор золота
block.t-gold-extractor.description = Медленно фильтрует золотые самородки от вулканической пыли. Процесс можно ускорить подачей воды.

#distribution
block.t-dark-conveyor.name = Тёмный конвейер
block.t-dark-conveyor.description = Перемещает предметы вперёд.

block.t-dark-junction.name = Тёмный перекрёсток
block.t-dark-junction.description = Пересечение двух конвейерных линий, принимает предметы с любой стороны и выводит с противоположной стороны.

block.t-dark-router.name = Тёмный маршрутизатор
block.t-dark-router.description = Равномерно распределяет предметы по 3 сторонам.
block.t-dark-router.details = не делайте роутерчейны. если будете, я вас лично убью...

block.t-dark-distributor.name = Тёмный распределитель
block.t-dark-distributor.description = Равномерно распределяет предметы по 7 сторонам.
block.t-dark-distributor.details = ...и дистрибьюторчейны не лучше.

block.t-dark-bridge-conveyor.name = Тёмный мостовой конвейер
block.t-dark-bridge-conveyor.description = Перемещает предметы поверх построек и поверхности.

block.t-plasma-driver.name = Плазменная катапульта
block.t-plasma-driver.description = Стреляет пачками предметов в другие плазменные катапульты, минуя поверхность.

#liquids
block.t-improved-conduit.name = Улучшенный трубопровод
block.t-improved-conduit.description = Перемещает жидкости вперёд. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-thermo-conduit.name = Термотрубопровод
block.t-plasma-conduit.description = Усиленный трубопровод, способный выносить более экстремальные температуры.

block.t-improved-liquid-junction.name = Улучшенный жидкостный перекрёсток
block.t-improved-liquid-junction.description = Пересечение двух трубопроводных линий, принимает жидкости с любой стороны и выводит с противоположной стороны. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-router.name = Улучшенный жидкостный маршрутизатор
block.t-improved-liquid-router.description = Равномерно распределяет жидкости по 3 сторонам. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-bridge.name = Улучшенный жидкостный мост
block.t-improved-liquid-bridge.description = Перемещает жидкости над постройками и поверхностью. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-container.name = Улучшенный жидкостный контейнер
block.t-improved-liquid-container.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Будет постепенно плавиться при вводе слишком горячих жидкостей.

#power
block.t-thermal-plate.name = Термальная пластина
block.t-thermal-plate.description = Медленно генерирует энергию, конвертируя тепловую энергию в электрическую.

block.t-energetic-node.name = Энергетический узел
block.t-energetic-node.description = Принимает и подаёт энергию на соседние и присоединённые блоки.

block.t-energetic-node-large.name = Большой энергетический узел
block.t-energetic-node-large.description = Усовершенствованный энергетический узел с большим количеством и дистанцией подключений.

block.t-lithium-battery.name = Литиевая батарея
block.t-lithium-battery.description = Хранит энергию во время её избытка и выводит во время дефицита.

#crafting
block.t-arc-furnace.name = Электродуговая печь
block.t-arc-furnace.description = Переплавляет руды в соответствующие металлы.

block.t-arc-smelter.name = Электродуговая плавильня
block.t-arc-smelter.description = Переплавляет руды в соответствующие металлы. Может сплавливать металлы в сплавы. Эффективнее, чем Электродуговая печь.

block.t-constructor.name = Конструктор
block.t-constructor.description = Создаёт технологии (предметы но круче) из обычных предметов и/или других технологий.

block.t-atmospheric-condenser.name = Атмосферный конденсатор
block.t-atmospheric-condenser.description = Конденсирует газы из атмосферы планеты.

block.t-enricher.name = Обогатитель
block.t-enricher.description = Обогащает руду для более эффективной плавки.

#defense
block.t-dark-wall.name = Тёмная стена
block.t-dark-wall.description = Простая стена, защищающая постройки от вражеских снарядов.

block.t-dark-wall-large.name = Большая тёмная стена
block.t-dark-wall-large.description = Простая стена, защищающая постройки от вражеских снарядов.

#units
block.t-unit-fabricator.name = Фабрикатор юнитов
block.t-unit-fabricator.description = Создаёт базовых юнитов. Юниты могут быть напрямую выведены или перенаправлены в реконструктор.

#effect
block.t-core-torch.name = Ядро: «Факел»
block.t-core-torch.description = Компактное, вместительное, бронированное ядро. После уничтожения весь контакт с сектором теряется.
block.t-core-torch.details = Первая итерация, среди многих. Самовоспроизводящееся.

block.t-core-blaze.name = Ядро: «Пламя»
block.t-core-blaze.description = Усовершенствованное ядро. Больше, с лучшей защитой, вместительнее чем Факел.
block.t-core-blaze.details = Вторая итерация.

block.t-dark-unloader.name = Тёмный разгрузчик
block.t-dark-unloader.description = Разгружает предметы из и в соседние блоки.

block.t-dark-container.name = Тёмный контейнер
block.t-dark-container.description = Хранит малое количество предметов. Расширяет хранилище при постановке около ядра. Содержимое может быть изьято при помощи разгрузчика. 

block.t-dark-vault.name = Тёмное хранилище
block.t-dark-vault.description = Хранит большое количество предметов. Расширяет хранилище при постановке около ядра. Содержимое может быть изьято при помощи разгрузчика.

block.t-radar.name = Радар
block.t-radar.description = Исследует область вокруг себя. Потребляет энергию.

#logic
block.t-switch.name = Переключатель
block.t-switch.description = Переключатель. Состояние может быть прочитано и установлено при помощи процессоров.

block.t-message.name = Сообщение
block.t-message.description = Хранит текстовые сообщения для связи между союзниками.\nМожет хранить ОЧЕНЬ много символов.

block.t-cell.name = Ячейка памяти
block.t-cell.description = Хранит численные значения для прочитывания и изменения процессорами.

block.t-bank.name = Блок памяти
block.t-bank.description = Хранит численные значения для прочитывания и изменения процессорами. Может хранить в 8 раза больше значений чем Ячейка памяти.

block.t-energetic-processor.name = Энергетический процессор
block.t-energetic-processor.description = Выполняет последовательность логических инструкций в цикле. Может контроллировать постройки и юнитов.

block.t-plasma-processor.name = Плазменный процессор
block.t-plasma-processor.description = Выполняет последовательность логических инструкций в цикле. Может контроллировать постройки и юнитов. Быстрее, чем Энергетический процессор.

block.t-display.name = Безграничный дисплей
block.t-display.description = Отображает произвольную информацию из процессоров. Никаких границ!

block.t-mini-display.name = Мини безграничный дисплей
block.t-mini-display.description = Отображает произвольную информацию из процессоров. Никаких границ! Миниатюрная версия.

block.t-string-memory-block.name = Строчная ячейка памяти
block.t-string-memory-block.description = Хранит строчные значения для прочитывания и изменения процессорами. Не может быть использовано, пока я не сделаю специальную логическую инструкцию.
block.t-string-memory-block.details = Я всегда этого хотел. Я хотел этого месяцами, может даже год или два. Наконец, я получил то что хотел.

