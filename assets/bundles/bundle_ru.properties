unit.t-quant.description = Небольшой мех. Быстро строит и чинит постройки. \"Защищает\" ядро Факел.

unit.t-cobra.name = Кобра
unit.t-cobra.description = Ползун с снайперской установкой.

unit.t-blade.name = Клинок
