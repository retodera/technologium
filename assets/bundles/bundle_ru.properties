#items
item.t-volcanic-sand.name = Вулканический песок
item.t-volcanic-sand.description = Содержит небольшие концентрации золота.

item.t-solid-neoplasm.name = Твёрдая неоплазма
item.t-solid-neoplasm.description = Неоплазма в безопасной твёрдой форме.
item.t-solid-neoplasm.details = Неоплазма становится твёрдой, чтобы образовывать структуры. Интересно...

item.t-hematite.name = Гематит
item.t-hematite.description = Сырая форма тёмного металла.
item.t-hematite.details = Всё ещё прочен, даже в сырой форме.

item.t-tin.name = Олово
item.t-tin.description = Лёгкий металл. Имеет водоотталкивающие свойства, из-за чего в основном используется в транспортации жидкостей.

item.t-dark-metal.name = Тёмный металл
item.t-dark-metal.description = Крепкий металл, используемый чуть ли не повсеместно.
item.t-dark-metal.details = Мой адвокат посоветовал мне не писать шутку тут. Хотя... да какая разница? Н... ладно.

item.t-lithium.name = Литий
item.t-lithium.description = Кристалл лития. Способен проводить и хранить энергию.

item.t-bauxite.name = Боксит
item.t-bauxite.description = Каменная порода, в основном содержащая оксид алюминия.

item.t-aluminium.name = Алюминий
item.t-aluminium.description = Прочный и очень лёгкий металл. Необходим для создания воздушных юнитов.

item.t-gold.name = Золото
item.t-gold.description = Плотный, мягкий, тяжёлый, пластичный металл, используемый в создании технологий и дорогостоящих [#7f7f7f3f](буквально)[] юнитах/блоках.
item.t-gold.details = Я НАШЁЛ ЗОЛОТО!!!!!!!

item.t-gold-glass.name = Золотое стекло
item.t-gold-glass.description = Очень тонкий лист сплавленных золота и алюминия. Используется в перемещении жидкостей. Имеет низкую точку плавления, из-за чего блоки из него не выдерживают высоких температур.
item.t-gold-glass.details = В реальной жизни золотые листы смещают цветовой спектр в сторону зелёного. Говоря о реальной жизни, иди потрогай траву прямо сейчас.

item.t-necrohexin.name = Некрогексин
item.t-necrohexin.description = Экстремально нестабильный материал. Легко возгорается, мощно взрывается.
item.t-necrohexin.details = Прошлое название: негативий, из которого на 99% состою я, retodera.

item.t-canned-neoplasm.name = Консервированная неоплазма
item.t-canned-neoplasm.description = Неоплазма, помещённая в оловянный контейнер для лёгкой и безопасной транспортации.
item.t-canned-neoplasm.details = Технически, неоплазма это клетки, а клетки это живые организмы. Может, неоплазма тоже может учиться...\nТолько не ведите её в школу, плохо кончится.

item.t-trained-neoplasm.name = Тренированная неоплазма
item.t-trained-neoplasm.description = Неоплазма, натренированная совершать различные действия, такие как контроль юнитов/построек.
item.t-trained-neoplasm.details = Не забывайте её кормить вкусняшками время от времени, иначе она может начать революцию!\nПросто шучу... или нет?

item.t-molybdenum.name = Молибден
item.t-molybdenum.description = Имеет водоотталкивающие свойства. Используется в улучшенном перемещении жидкостей. Более теплоустойчивый, чем золотое стекло.

item.t-rhenium.name = Рений
item.t-rhenium.description = Имеет высшую проводимость и обьём хранения энергии, чем литий. Используется в продвинутой электронике.

item.t-iron.name = Железо
item.t-iron.description = Типичный металл. По составу и свойствам крайне похож на тёмный металл.
item.t-iron.details = Последнее предложение было добавлено, потому что железо делают из гематита.

item.t-calcium.name = Кальций
item.t-calcium.description = Используется в теплоустойчивом оборудовании.
item.t-calcium.details = :skull:

item.t-silicon.name = Кремний
item.t-silicon.description = Полупроводник. Используется в продвинутых способах получения энергии.
item.t-silicon.details = siligone

item.t-silica.name = Кварц
item.t-silica.description = Белый кристалл кварца.
item.t-silica.details = Раньше назывался Кремнезём. Призрак предлагал получать кремний из кварца. До этого, он предложил получать кремнезём из кремния. НО ДЕЛО В ТОМ, ЧТО КРЕМНЕЗЁМ И ЕСТЬ КВАРЦ...

item.t-aerogel.name = Аэрогель
item.t-aerogel.description = Очень лёгкое вещество. На 99% состоит из газа, имеет плохую теплопроводность.
item.t-aerogel.details = А также имеет анюка в рот.

item.t-pegmatite.name = Пегматит
item.t-pegmatite.description = Каменная порода, содержащая небольшие концентрации лития.
item.t-pegmatite.details = Мы очень, ОЧЕНЬ долго думали, как получить литий.

item.t-enriched-metal.name = Обогащённый металл
item.t-enriched-metal.description = Обогащённый металл для более эффективной плавки.

item.t-enriched-aluminium.name = Обогащённый алюминий
item.t-enriched-aluminium.description = Обогащённый металл для более эффективной плавки.

item.t-cog.name = Шестерня
item.t-cog.description = Первая полученная технология. Передаёт кинетическую энергию.
item.t-cog.details = Технически, это восьмерня.

item.t-armor-plate.name = Броневая пластина
item.t-armor-plate.description = Прочная пластина, используемая в создании более прочных построек, стен и юнитов.
item.t-armor-plate.details = ЧЕЛЛЕНДЖ: ЮНИТЫ ВЕТКИ КОБРЫ ПРОТИВ 200 БРОНЕВЫХ ПЛАСТИН!!!!!!!!!!!!!!!!!!

item.t-bioprocessor.name = Биопроцессор
item.t-bioprocessor.description = Эксплуатирует неоплазму для имитации процессора и контроля построек/единиц.
item.t-bioprocessor.details = Зачем сажать в рабство [ВЫРЕЗАНО], когда есть неоплазма?

item.t-accumulator.name = Аккумулятор
item.t-accumulator.description = Может принимать, хранить и выводить энергию.

item.t-adv-accumulator.name = Улучшенный аккумулятор
item.t-adv-accumulator.description = Может принимать, хранить и выводить энергию в больших объёмах.

item.t-adv-bioprocessor.name = Улучшенный биопроцессор
item.t-adv-bioprocessor.description = Эксплуатирует неоплазму для более точной имитации процессора и контроля построек/единиц.

item.t-shield-gen.name = Генератор щита
item.t-shield-gen.description = Использует энергию для образования щита.

item.t-adv-shield-gen.name = Улучшенный генератор щита
item.t-adv-shield-gen.description = Эффективнее использует энергию для образования более прочного щита.

item.t-memory-card.name = Карта памяти
item.t-memory-card.description = Используется для хранения информации.

item.t-tin-can.name = Оловянная консерва
item.t-tin-can.description = Используется для хранения и транспортировки жидкостей.

item.t-leptine.name = Лептин
item.t-leptine.description = Очень гибкий фрукт, прямо как и его дерево.
item.t-leptine.details = Его гибкость происходит не просто из неоткуда.

item.t-leptine-seed.name = Семечко лептина
item.t-leptine-seed.description = Семечко, добытое из фрукта Лептина.
item.t-leptine-seed.details = Другого применения, кроме как сажать, нету... пока что.

item.t-theimpossible.name = невозможное.
item.t-theimpossible.description = Существует, чтобы НЕ ПОЗВОЛИТЬ ИГРОКАМ ИССЛЕДОВАТЬ ЧТО ЕЩЁ ПОКА НЕЛЬЗЯ. а также прикольно что оно будет показывать "Исследуйте невозможное."
item.t-theimpossible.details = ещё прикольно что это реально невозможно чтобы говнокодер анюк нормально кодил

item.t-condom.name = Презерватив
item.t-condom.description = добавлено по просьбе Призрака. может, чтобы надевать их на члены [#ff00ff]♂DUNGEON FLARES♂[], которые его ебут каждый день.
item.t-condom.details = Знали ли вы, что мать анюка превышает по размерам видимую Вселенную?

