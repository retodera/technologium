block.t-thermal-generator.description = Преобразовывает тепло в энергию.

block.t-solar-panel.name = Солнечная панель
block.t-solar-panel.description = Собирает солнечное тепло и преобразует её в энергию.

block.t-lithium-combustion-chamber.name = Литиевая камера сгорания
block.t-lithium-combustion-chamber.description = Использует реакцию лития с водой для генерации энергии.

block.t-energetic-node.name = Энергетический узел
block.t-energetic-node.description = Принимает и подаёт энергию на присоединённые и соседние блоки.

block.t-energetic-node-large.name = Большой энергетический узел
block.t-energetic-node-large.description = Усовершенствованный энергетический узел с большим количеством и дистанцией подключений.

block.t-lithium-battery.name = Литиевая батарея
block.t-lithium-battery.description = Хранит энергию во время её избытка и выводит во время дефицита.

block.t-large-lithium-battery.name = Большая литиевая батарея
block.t-large-lithium-battery.description = Хранит энергию во время её избытка и выводит во время дефицита.

block.t-cliff-thermal-plate.name = Наскальная термальная пластина
block.t-cliff-thermal-plate.description = Новый уровень бесполезности.

#crafting
block.t-arc-furnace.name = Электродуговая печь
block.t-arc-furnace.description = Переплавляет руды в соответствующие металлы.

block.t-arc-smelter.name = Электродуговая плавильня
block.t-arc-smelter.description = Переплавляет руды в соответствующие металлы. Может сплавливать металлы в сплавы. Эффективнее, чем Электродуговая печь.

block.t-item-constructor.name = Предметный конструктор
block.t-item-constructor.description = Создаёт технологии из обычных предметов. Опционально использует воду для увеличения эффективности.

block.t-atmospheric-condenser.name = Атмосферный конденсатор
block.t-atmospheric-condenser.description = Конденсирует и сжижает газы из атмосферы планеты.

block.t-enricher.name = Обогатитель
block.t-enricher.description = Перерабатывает руды в обогащённые аналоги.

block.t-filter.name = Фильтр
block.t-filter.description = Фильтрует загрязнённые жидкости и минералы из жидкостей/порошка.

block.t-packer.name = Упаковщик
block.t-packer.description = Упаковывает или распаковывает жидкости из консерв.

block.t-training-center.name = Центр обучения
block.t-training-center.description = Наполняет неоплазму знаниями для последующего использования в производстве. Опционально использует воду для увеличения эффективности.
block.t-training-center.details = Восстановленная технология.\nПохоже, враги использовали неоплазму чтобы контроллировать большую часть всего, и они использовали эту постройку чтобы сделать её достаточно интеллигентной.\nВсё ещё неизвестно, почему неоплазма сейчас покрывает поверхность Кудола.

block.t-chemical-plant.name = Химический завод
block.t-chemical-plant.description = хых ъыъ ьыь жыж жыж жыж жыжыж жыжыжыжыыжыжжыжыж призрак придумывай аааа ывщзфвхщавщх

block.t-lava-extractor.name = Лавовый экстрактор
block.t-lava-extractor.description = Извлекает небольшие концентрации металлов из лавы.

