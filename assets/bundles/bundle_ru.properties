#units
unit.t-quant.name = Квант
unit.t-quant.description = Защищает ядро «Факел». Быстро строит и чинит постройки. Оснащён ремонтирующим лучом.

unit.t-lonter.name = Лонтер
unit.t-lonter.description = Защищает ядро «Пламя». Быстро летает, строит и чинит постройки. Оснащён двумя автоматизированными ремонтирующими лучами, чинящими постройки и боевые единицы.

unit.t-cobra.name = Кобра
unit.t-cobra.description = Ползун с снайперской установкой. Страх баз с турелями ближнего действия и/или без регенераторов.

unit.t-python.name = Питон
unit.t-python.description = Обстреливает вражеские базы залпом из артиллерийских снарядов.

unit.t-blade.name = Клинок
unit.t-blade.description = Выстреливает продолжительный лазерный луч, поджигающий вражеские постройки.

unit.t-saber.name = Сабля
unit.t-saber.description = Сжигает вражеские постройки двумя мощными лазерными установками.

unit.t-napalm.name = Напалм
unit.t-napalm.description = Заряжает мощный продолжительный луч, поджигающий вражеские постройки.

unit.t-mercury.name = Меркурий
unit.t-mercury.description = Быстро летает, стреляет и уничтожает вражеские постройки и юнитов.

unit.t-mars.name = Марс
unit.t-mars.description = Стреляет залпами пуль по врагам.

unit.t-phobos.name = Фобос
unit.t-phobos.description = Стреляет залпами ракет и двумя пробивающими лазерами по врагам.

unit.t-monopoly.name = Монополия
unit.t-monopoly.description = Скрещение юнитов Моно и Поли. Имеет улучшенную статистику обоих.

unit.t-flarerouterlegs.name = Вспышка роутер на ножках
unit.t-flarerouterlegs.description = "сделайте вспышку роутер на ножках" - кто-то из какого-то тг сервака

