 you don't go\nYou'll never shine if you don't glow\n\nHey now, you're an all star\nGet your game on, go play\nHey now, you're a rock star\nGet the show on, get paid\nAnd all that glitters is gold\nOnly shootin' stars break the mold\nAnd all that glitters is gold\nOnly shootin' stars break the mold\n\n\n\nда, у меня был абсолютный ноль причин писать это вручную (без ctrl+c ctrl+v вообще) но я всё равно это сделал. оно того стоило.

#distribution
block.t-metallic-conveyor.name = Металлический конвейер
block.t-metallic-conveyor.description = Перемещает предметы вперёд.

block.t-metallic-junction.name = Металлический перекрёсток
block.t-metallic-junction.description = Пересечение двух конвейерных линий. Принимает предметы с любой стороны и выводит с противоположной.

block.t-metallic-router.name = Металлический маршрутизатор
block.t-metallic-router.description = Равномерно распределяет предметы по всем сторонам.
block.t-metallic-router.details = не делайте роутерчейны. если будете, я вас лично убью...

block.t-metallic-distributor.name = Металлический распределитель
block.t-metallic-distributor.description = Равномерно распределяет предметы по всем сторонам.
block.t-metallic-distributor.details = ...и дистрибьюторчейны не лучше.

block.t-metallic-bridge-conveyor.name = Мостовой металлический конвейер
block.t-metallic-bridge-conveyor.description = Перемещает предметы поверх построек и поверхности.

block.t-metallic-sorter.name = Металлический сортировщик
block.t-metallic-sorter.description = Если вводимый предмет соответствует выбранному, он проходит вперёд, иначе выводится по бокам. Это поведение можно инвертировать нажатием по блоку и затем нажатием по \uE86A.

block.t-metallic-overflow-gate.name = Металлический избыточный затвор
block.t-metallic-overflow-gate.description = Если передний путь заблокирован, выводит предметы по бокам.

block.t-metallic-underflow-gate.name = Металлический избыточный шлюз
block.t-metallic-underflow-gate.description = Если пути слева и справа заблокированы, выводит предметы вперёд.

block.t-mechanical-driver.name = Механическая катапульта
block.t-mechanical-driver.description = Стреляет пачками предметов в другие катапульты, минуя поверхность. Выстреливаемые пачки могут сталкиваться с вражескими юнитами.

block.t-fused-junction.name = Скрещённый перекрёсток
block.t-fused-junction.description = Скрещение Металлического и Улучшенного жидкостного перекрёстков. Принимает предметы и жидкости с любой стороны и выводит на противоположную.

#liquids
block.t-improved-conduit.name = Улучшенный трубопровод
block.t-improved-conduit.description = Перемещает жидкости вперёд. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-junction.name = Улучшенный жидкостный перекрёсток
block.t-improved-liquid-junction.description = Пересечение двух трубопроводных линий. Принимает жидкости с любой стороны и выводит с противоположной. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-router.name = Улучшенный жидкостный маршрутизатор
block.t-improved-liquid-router.description = Равномерно распределяет жидкости по всем сторонам. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-bridge.name = Улучшенный жидкостный мост
block.t-improved-liquid-bridge.description = Перемещает жидкости над постройками и поверхностью. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-container.name = Улучшенный жидкостный контейнер
block.t-improved-liquid-container.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-tank.name = Улучшенный жидкостный бак
block.t-improved-liquid-tank.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-advanced-conduit.name = Продвинутый трубопровод
block.t-advanced-conduit.description = Перемещает жидкости вперёд. Более термостойкий, чем улучшенный трубопровод.

block.t-advanced-liquid-junction.name = Продвинутый жидкостный перекрёсток
