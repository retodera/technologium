#sectors
sector.landing.name = Посадка
sector.landing.description = Начальная точка амбициозного приключения на тектонической планете.\nНизкий уровень угрозы, немного ресурсов, всё что нужно.\nЗахватите сектор, исследуйте всё возможное и продвигайтесь дальше.
landing.start = Кажется, посадка была мягкой, твоё ядро не повреждено.
landing.mine = Начни с копания [accent]Гематита[] и [accent]Олова[] - самых необходимых ресурсов.\n[gray]Гематит тёмно-оранжевый, олово - бирюзовое.
landing.research1 = Открой [accent]Дерево технологий[] и исследуй [accent]Тёмную дрель[] и [accent]Тёмный конвейер[].
landing.drill = Поставь [accent]Тёмную дрель[] поверх [accent]гематитовой руды[].
landing.power1 = Похоже, что тёмная дрель не работает... Ей нужна [accent]энергия...
landing.power2 = Ещё немного покопай вручную, исследуй [accent]Термальную пластину[] и поставь её поверх [accent]термального камня[].
landing.power3 = Теперь исследуй [accent]Энергетический узел[] и подсоедини термальную пластину к тёмному буру.
landing.research2 = Время для стенодробительного изобретения: [accent]Тёмный плазменный бур[]! Исследуй его в дереве технологий.
landing.tin = Поставь плазменный бур, чтобы он смотрел на стену, содержащую оловянную руду, затем подсоедини его при помощи энергетических узлов.
landing.conveyor = Проведи конвейерную линию от тёмной дрели и плазменного бура к ядру.
landing.production = Ты успешно построил производство необходимых ресурсов. Обещаю, всё станет только хуже...
landing.pegmatite = Поищи поблизости [accent]пегматит[]. Это бежевый камень с тёмными полосками. Как только найдёшь, поставь бур поверх него.
landing.lithium = Пегматит содержит немного лития. Исследуй и поставь [accent]Электродуговую печь[], затем настрой её на переплавку пегматита в литий.
landing.metal = Благодаря электродуговой печи можно получить и [accent]Тёмный металл[]. Поставь очередную печь и настрой на переплавку гематита в тёмный металл.
landing.enricher = Данные способы получения лития и тёмного металла неэффективны. Исследуй [accent]Обогатитель[].
landing.enriching = Обогатитель обогащает руду для более эффективной переплавки. Тебе стоит использовать его почаще.
landing.explore = Кажется, твоя энергия заканчивается. Стоит пойти исследовать окружающую среду.
landing.exploring1 = Исследуй [accent]Радар[] и поставь его вблизи тумана войны, после чего запитай его.
landing.exploring2 = Продолжай искать термальные камни, и не только.
landing.defense1 = Обнаружена атака неизвестной фракции. Исследуй турель [accent]Зависть[] и [accent]Тёмные стены[].
landing.defense2 = Перекрой стенами все проходы и поставь со стороны своей базы турели и запитай их.
landing.defense3 = Враги вторглись в сектор.
landing.defense4 = Похоже, у тебя получилось защититься. Продолжай исследовать и защищаться, нужно прожить ещё немного волн.