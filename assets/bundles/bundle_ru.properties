#units
unit.t-quant.name = Квант
unit.t-quant.description = Защищает ядро «Факел». Быстро строит и чинит постройки. Оснащён ремонтирующим лучом.

unit.t-lonter.name = Лонтер
unit.t-lonter.description = Защищает ядро «Пламя». Быстро летает, строит и чинит постройки. Оснащён двумя автоматизированными ремонтирующими лучами, чинящими постройки и боевые единицы.

unit.t-cobra.name = Кобра
unit.t-cobra.description = Ползун с снайперской установкой. Страх баз с турелями ближнего действия и/или без регенераторов.

unit.t-python.name = Питон
unit.t-python.description = Обстреливает вражеские базы залпом из артиллерийских снарядов.

unit.t-blade.name = Клинок
unit.t-blade.description = Выстреливает продолжительный лазерный луч, замедляясь, поджигая и ломая вражеские и леча дружественные постройки.

unit.t-saber.name = Сабля
unit.t-saber.description = Сжигает вражеские и лечит дружественные постройки двумя мощными лазерными установками.

unit.t-mercury.name = Меркурий
unit.t-mercury.description = Быстро летает, стреляет и уничтожает вражеские постройки и юнитов, особенно толпой.

unit.t-mars.name = Марс
unit.t-mars.description = Уничтожает всё пулемётом и двумя турелями точечной защиты.

unit.t-metalstrong.name = Металлстронг
unit.t-metalstrong.description = кринж.\n\"Когда же ты сдохнешь?\"\n\"[gray]Наносталиний, сынок.[]\"\n\"[gray]Он застывает в момент физического повреждения.[]\"\n\"[gray]Вы не можете мне навредить, Расколотые![]\"

