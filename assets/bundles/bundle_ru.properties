item.t-lithium.name = Литий
item.t-lithium.description = Кристалл лития, способный проводить и хранить энергию.

item.t-bauxite.name = Боксит
item.t-bauxite.description = Алюминиевая руда, в основном содержащая оксид алюминия. Может быть превращена в глинозём.

item.t-aluminium.name = Алюминий
item.t-aluminium.description = Прочный и очень лёгкий металл. Требуется для создания воздушных юнитов.

item.t-gold.name = Золото
item.t-gold.description = Плотный, мягкий, тяжёлый, пластичный металл, используемый в создании технологий и дорогостоящих [#7f7f7f3f](буквально)[] юнитах/блоках.
item.t-gold.details = Я НАШЁЛ ЗОЛОТО!!!!!!!

