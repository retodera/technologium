block.t-solid-lava-wall.name = Стена из застывшей лавы
block.t-solid-lava-boulder.name = Застывшая лава
block.t-solid-lava-fumarole.name = Фумарола из застывшей лавы

#turrets
block.t-comet.name = Комета
block.t-comet.description = Стреляет пробивающим лазером по врагам.

block.t-constellation.name = Созвездие
block.t-constellation.description = Обстреливает врагов залпом из энергетических пуль.

block.t-meteor.name = Метеор
block.t-meteor.description = Стреляет артиллерийскими снарядами по наземным вражеским целям на большой дистанции.

block.t-strike.name = Стачка
block.t-strike.description = Стреляет кусками металлов по наземным врагам.

block.t-needle.name = Игла
block.t-needle.description = Стреляет потоками жидкости по врагам.

block.t-squall.name = Шквал
block.t-squall.description = Обстреливает вражеские летающие единицы шквалом пуль.
block.t-squall.details = Сначала турель Залп, стреляющая залпами пуль, а теперь есть и Шквал, стреляющий шквалом пуль. отлично.

block.t-discharge.name = Разряд
block.t-discharge.description = Заряжает и выстреливает энергетическим шаром, бьющим молниями по вражеским единицам.

block.t-supression-projector.name = Подавляющий проектор
block.t-supression-projector.description = Повреждает вражеские единицы в квадратном поле.
block.t-supression-projector.details = Нет, он не подавляет регенерацию как Подавление и Разрушение.

#production
block.t-metallic-plasma-bore.name = Металлический плазменный бур
block.t-metallic-plasma-bore.description = При размещении напротив стены с рудой, постоянно выводит предметы. Требует энергию для работы.

block.t-advanced-plasma-bore.name = Улучшенный плазменный бур
block.t-advanced-plasma-bore.description = Увеличенный бур. Имеет повышенную скорость и увеличенную дальность бурения. Дополнительно требует воду для работы.

block.t-wall-crusher.name = Дробитель скал
block.t-wall-crusher.description = Дробит стены, выводя соответствующие предметы. Вывод и эффективность зависят от типа стены. Требует энергию для работы.

block.t-metallic-drill.name = Металлическая дрель
block.t-metallic-drill.description = При размещении на соответствующей руде, постоянно выводит предметы в медленном темпе. Способен добывать только базовые ресурсы. Требует энергию для работы.

block.t-advanced-drill.name = Улучшенная дрель
block.t-advanced-drill.description = Способна добывать боксит. Добывает быстрее, чем металлическая дрель.

block.t-extractor-drill.name = Экстракторная дрель
block.t-extractor-drill.description = Позволяет добывать еще быстрее с помощью простейших технологий. Способен добывать <ПОКА_НЕ_ДОБАВЛЕНО>.

block.t-pyrolysis-drill.name = Пиролизный бур
block.t-pyrolysis-drill.description = Нагревает пепел до критических температур и извлекает углерод. Опционально использует лаву для увеличения эффективности.

block.t-capillar-pump.name = Капиллярная помпа
block.t-capillar-pump.description = Извлекает сирин из жил, используя поверхностное натяжение.

block.t-fumarole-turbine.name = Фумароловая турбина
block.t-fumarole-turbine.description = Использует фумаролы для генерации энергии и получения серы.

block.t-agricultural-crane.name = Сельскохозяйственный кран <УСТАРЕЛ>
block.t-agricultural-crane.description = Сажает семена в подключенные горшки и собирает урожай с них.
block.t-agricultural-crane.details = О НЕТ ГЛЕБА АААА СПАСИТИ ПАМАГИТИ АААА

block.t-pot.name = Горшок <УСТАРЕЛ>
block.t-pot.description = Используется сельскохозяйственным краном для выращивания растений. Выращиваемый фрукт может быть настроен.
