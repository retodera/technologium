#production
block.t-metallic-plasma-bore.name = Металлический плазменный бур
block.t-metallic-plasma-bore.description = При размещении напротив стены с рудой, постоянно выводит предметы. Требует небольшое количество энергии для работы.

block.t-mini-plasma-bore.name = Мини плазменный бур
block.t-mini-plasma-bore.description = При размещении напротив стены с рудой, постоянно выводит предметы. Требует небольшое количество энергии для работы. Миниатюрная версия.

block.t-metallic-drill.name = Металлическая дрель
block.t-metallic-drill.description = При размещении на соответствующей руде, постоянно выводит предметы в медленном темпе. Способен добывать только базовые ресурсы.

block.t-advanced-drill.name = Улучшенная дрель
block.t-advanced-drill.description = Улучшенная дрель, способная добывать боксит. Добывает быстрее, чем металлическая дрель.

block.t-agricultural-crane.name = Сельскохозяйственный кран
block.t-agricultural-crane.description = Сажает семена в подключенные горшки и собирает урожай с них.
block.t-agricultural-crane.details = О НЕТ ГЛЕБА АААА СПАСИТИ ПАМАГИТИ АААА

block.t-pot.name = Горшок
block.t-pot.description = Используется сельскохозяйственным краном для выращивания растений. Выращиваемый фрукт может быть настроен.
block.t-pot.details = И НИ В КОЕМ СЛУЧАЕ НЕ ИСПОЛЬЗУЕТСЯ ДЛЯ РП.

#distribution
block.t-metallic-conveyor.name = Металлический конвейер
block.t-metallic-conveyor.description = Перемещает предметы вперёд.

block.t-metallic-junction.name = Металлический перекрёсток
block.t-metallic-junction.description = Пересечение двух конвейерных линий, принимает предметы с любой стороны и выводит с противоположной стороны.

block.t-metallic-router.name = Металлический маршрутизатор
block.t-metallic-router.description = Равномерно распределяет предметы по 3 сторонам.
block.t-metallic-router.details = не делайте роутерчейны. если будете, я вас лично убью...

block.t-metallic-distributor.name = Металлический распределитель
block.t-metallic-distributor.description = Равномерно распределяет предметы по 7 сторонам.
block.t-metallic-distributor.details = ...и дистрибьюторчейны не лучше.

block.t-metallic-bridge-conveyor.name = Мостовой металлический конвейер
block.t-metallic-bridge-conveyor.description = Перемещает предметы поверх построек и поверхности.

block.t-metallic-sorter.name = Металлический сортировщик
block.t-metallic-sorter.description = Если вводимый предмет соответствует выбранному, он проходит вперёд, иначе выводится по бокам. Это поведение можно инвертировать нажатием по блоку и затем нажатием по \uE86A.

block.t-metallic-overflow-gate.name = Металлический избыточный затвор
block.t-metallic-overflow-gate.description = Если передний путь заблокирован, выводит предметы по бокам.

block.t-metallic-underflow-gate.name = Металлический избыточный шлюз
block.t-metallic-underflow-gate.description = Если пути слева и справа заблокированы, выводит предметы вперёд.

block.t-mechanical-driver.name = Механическая катапульта
block.t-mechanical-driver.description = Стреляет пачками предметов в другие катапульты, минуя поверхность. Выстреливаемые пачки могут сталкиваться с вражескими юнитами.
block.t-fused-junction.name = Скрещённый перекрёсток
block.t-fused-junction.description = Скрещение Металлического и Улучшенного жидкостного перекрёстков. Принимает предметы и жидкости с любой стороны и выводит на противоположную.

#liquids
block.t-improved-conduit.name = Улучшенный трубопровод
block.t-improved-conduit.description = Перемещает жидкости вперёд. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-thermo-conduit.name = Термотрубопровод
block.t-thermo-conduit.description = Усиленный трубопровод, способный выносить более экстремальные температуры.

block.t-improved-liquid-junction.name = Улучшенный жидкостный перекрёсток
block.t-improved-liquid-junction.description = Пересечение двух трубопроводных линий, принимает жидкости с любой стороны и выводит с противоположной стороны. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-router.name = Улучшенный жидкостный маршрутизатор
block.t-improved-liquid-router.description = Равномерно распределяет жидкости по 3 сторонам. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-bridge.name = Улучшенный жидкостный мост
block.t-improved-liquid-bridge.description = Перемещает жидкости над постройками и поверхностью. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-container.name = Улучшенный жидкостный контейнер
block.t-improved-liquid-container.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Будет постепенно плавиться при вводе слишком горячих жидкостей.

block.t-improved-liquid-sorter.name = Улучшенный жидкостный сортировщик
block.t-improved-liquid-sorter.description = Если вводимая жидкость соответствует выбранной, она проходит вперёд, иначе выводится по бокам. Это поведение можно инвертировать нажатием по блоку и затем нажатием по \uE86A.
block.t-improved-liquid-sorter.details = Абсолютно бесполезно. Ну, пока я не сделаю пластановый трубопровод и жидкостный разгрузчик.
lsorter.sort = Сортировка: {0}
lsorter.normal = Обычная
lsorter.inverted = Инвертированная

#power
block.t-thermal-plate.name = Термальная пластина
block.t-thermal-plate.description = Медленно преобразовывает тепловую энергию в электрическую.

block.t-thermal-generator.name = Термальный генератор
block.t-thermal-generator.description = Преобразовывает тепловую энергию в электрическую.

block.t-solar-panel.name = Солнечная панель
block.t-solar-panel.description = Собирает солнечную энергию сквозь плотную атмосферу Кудола и преобразует её в электрическую.

block.t-lithium-combustion-chamber.name = Литиевая камера сгорания
block.t-lithium-combustion-chamber.description = Использует реакцию лития с водой для создания взрывов и генерации энергии.

block.t-energetic-node.name = Энергетический узел
block.t-energetic-node.description = Принимает и подаёт энергию на соседние и присоединённые блоки.

block.t-energetic-node-large.name = Большой энергетический узел
block.t-energetic-node-large.description = Усовершенствованный энергетический узел с большим количеством и дистанцией подключений.

block.t-lithium-battery.name = Литиевая батарея
block.t-lithium-battery.description = Хранит энергию во время её избытка и выводит во время дефицита.

block.t-large-lithium-battery.name = Большая литиевая батарея
block.t-large-lithium-battery.description = Хранит энергию во время её избытка и выводит во время дефицита.

#crafting
block.t-arc-furnace.name = Электродуговая печь
block.t-arc-furnace.description = Переплавляет руды в соответствующие металлы.

block.t-arc-smelter.name = Электродуговая плавильня
block.t-arc-smelter.description = Переплавляет руды в соответствующие металлы. Может сплавливать металлы в сплавы. Эффективнее, чем Электродуговая печь.

block.t-item-constructor.name = Конструктор
block.t-item-constructor.description = Создаёт технологии (предметы но круче) из обычных предметов и/или других технологий.

block.t-atmospheric-condenser.name = Атмосферный конденсатор
block.t-atmospheric-condenser.description = Конденсирует и сжижает газы из атмосферы планеты.
block.t-atmospheric-condenser.details = сЖЫЖает. жыж. не спрашивайте что это значит - я сам не знаю хотя я сам это и придумал. Знайте, что у этого есть значение, и это не "дух огня".

block.t-mixer.name = Миксер
block.t-mixer.description = Делает разное: смешивает руды в их обогащённый вариант; смешивает предметы; смешивает жидкости; смешивает предметы с жидкостями.

block.t-filter.name = Фильтр
block.t-filter.description = Фильтрует минералы из жидкостей/порошка.

#defense
block.t-metallic-wall.name = Металлическая стена
block.t-metallic-wall.description = Простая стена, защищающая постройки от вражеских снарядов.

block.t-metallic-wall-large.name = Большая металлическая стена
block.t-metallic-wall-large.description = Простая стена, защищающая постройки от вражеских снарядов.

block.t-armored-wall.name = Бронированная стена
block.t-armored-wall.description = Прочная стена, защищающая постройки от вражеских снарядов.

block.t-armored-wall-large.name = Большая бронированная стена
block.t-armored-wall-large.description = Прочная стена, защищающая постройки от вражеских снарядов.

#units
block.t-unit-fabricator.name = Фабрикатор юнитов
block.t-unit-fabricator.description = Создаёт базовых юнитов. Юниты могут быть выведены напрямую или перенаправлены в другие блоки.

block.t-metallic-payload-conveyor.name = Металлический грузовой конвейер
block.t-metallic-payload-conveyor.description = Перемещает блоки и юнитов вперёд.

#effect
block.t-core-torch.name = Ядро: «Факел»
block.t-core-torch.description = Компактное, вместительное, бронированное ядро. После уничтожения весь контакт с сектором теряется.
block.t-core-torch.details = Первая итерация, среди многих. Самовоспроизводящееся.

block.t-core-blaze.name = Ядро: «Пламя»
block.t-core-blaze.description = Усовершенствованное ядро. Больше, с лучшей защитой, вместительнее чем Факел.
block.t-core-blaze.details = Вторая итерация.

block.t-metallic-unloader.name = Металлический разгрузчик
block.t-metallic-unloader.description = Разгружает предметы из и в соседние блоки.

block.t-metallic-container.name = Металлический контейнер
block.t-metallic-container.description = Хранит малое количество предметов. Расширяет хранилище при постановке около ядра. Содержимое может быть изьято при помощи разгрузчика. 

block.t-metallic-vault.name = Металлическое хранилище
block.t-metallic-vault.description = Хранит большое количество предметов. Расширяет хранилище при постановке около ядра. Содержимое может быть изьято при помощи разгрузчика.

block.t-mini-mender.name = Мини регенератор
block.t-mini-mender.description = Медленно регенерирует постройки в радиусе. Процесс может быть ускорен подачей тёмного металла.

block.t-mini-shield-projector.name = Мини проектор щита
block.t-mini-mender.description = Создаёт вокруг себя щит, защищающий постройки внутри себя от урона. Радиус щита, скорость регенерации и восстановления могут быть увеличены подачей генераторов щита.

block.t-radar.name = Радар
block.t-radar.description = Исследует область вокруг себя. Потребляет энергию.

block.t-long-range-radar.name = Радар дальнего действия
block.t-long-range-radar.description = Исследует область вокруг себя. Имеет больший радиус, чем у обычного Радара. Потребляет энергию.

#logic
block.t-switch.name = Переключатель
block.t-switch.description = Переключатель. Состояние может быть прочитано и установлено при помощи процессоров.

block.t-message.name = Сообщение
block.t-message.description = Хранит текстовые сообщения для связи между союзниками и передачи текстовых данных.\nМожет хранить ОЧЕНЬ много символов.
block.t-message.details = Да, это просто немного изменённый спрайт строчной ячейки памяти. А чё? По сути одно и то же - просто сообщение может хранить только 600 символов, а ячейка - гораздо больше...

block.t-cell.name = Ячейка памяти
block.t-cell.description = Хранит численные значения для прочитывания и изменения процессорами.

block.t-bank.name = Блок памяти
block.t-bank.description = Хранит численные значения для прочитывания и изменения процессорами. Может хранить в 8 раза больше значений, чем Ячейка памяти.

block.t-energetic-processor.name = Энергетический процессор
block.t-energetic-processor.description = Выполняет последовательность логических инструкций в цикле. Может контроллировать постройки и юнитов.

block.t-plasma-processor.name = Плазменный процессор
block.t-plasma-processor.description = Выполняет последовательность логических инструкций в цикле, но быстрее. И так понятно, что может контроллировать постройки и юнитов. Быстрее, чем Энергетический процессор.

block.t-gamma-processor.name = Гамма-процессор
block.t-gamma-processor.description = Как и прошлые версии, выполняет последовательность логических инструкций в цикле. Вам уже известно, что он может контроллировать постройки и юнитов. Быстрее, чем Плазменный процессор.

block.t-omega-processor.name = Омега-процессор
block.t-omega-processor.description = Ультимативный процессор. Требует гигантское количество энергии для работы.

block.t-borderless-display.name = Безграничный дисплей
block.t-borderless-display.description = Отображает произвольную информацию из процессоров. Никаких границ!

block.t-borderless-display-mini.name = Мини безграничный дисплей
block.t-borderless-display-mini.description = Отображает произвольную информацию из процессоров. Никаких границ! Миниатюрная версия.

block.t-string-cell.name = Строчная ячейка памяти
block.t-string-cell.description = Хранит строчные значения для прочитывания и изменения процессорами.
block.t-string-cell.details = Я всегда этого хотел. Я хотел этого месяцами, может даже год или два. Наконец, я получил то что хотел.

memoryblock.edit = Редактировать
memoryblock.copy = Скопировать
memoryblock.paste = Вставить
memoryblock.rows = Строки
memoryblock.cols = Столбцы

block.t-projector.name = Прожектор
block.t-projector.description = Отображает произвольную информацию из процессоров на указанные координаты, с конфигурируемыми размером проекции и самого дисплея.
block.t-projector.details = Возможно, это не самая лучшая идея ставить кучу проекторов, так как они прогружаются где бы ты ни был. Это сделано, чтобы проекция отображалась даже тогда, когда сам проектор не на экране.

