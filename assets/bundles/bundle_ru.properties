item.t-gold-glass.details = В реальной жизни золотые листы смещают цвет в сторону зелёного.

item.t-canned-neoplasm.name = Консервированная неоплазма
item.t-canned-neoplasm.description = Неоплазма, помещённая в оловянный контейнер для лёгкой и безопасной транспортации.
item.t-canned-neoplasm.details = Технически, неоплазма это клетки, а клетки это живые организмы. Может, неоплазма тоже может учиться...

item.t-trained-neoplasm.name = Тренированная неоплазма
item.t-trained-neoplasm.description = Неоплазма, натренированная совершать всякие действия, такие как контроль юнитов/построек..
item.t-trained-neoplasm.details = Не забывайте её кормить вкусняшками время от времени, иначе она может начать революцию!\nПросто шучу... или нет?

item.t-uranium.name = Уран
item.t-uranium.description = Высокорадиоактивный элемент, в основном используемый в генерации энергии.
item.t-uranium.details = ммм сырой уран (чавканье с громкими тресками счётчика гейгера)

item.t-uranium-cell.name = Урановая ячейка
item.t-uranium-cell.description = Уран, заключённый в оболочке из <ПОКА_НЕ_ДОБАВЛЕНО>, готовый к использованию в Ядерном реакторе или Прессе боеприпасов.

item.t-stalinium.name = Сталиний
item.t-stalinium.description = Экстремально прочный и крепкий металл. Используется для создания наилучших юнитов и построек.
item.t-stalinium.details = оу, ты говоришь что это ТВОЙ сталиний? это НАШ сталиний, товарищ. (издалека слышен гимн СССР)

item.t-roskomnadzorium.name = Роскомнадзорий
