#sectors
sector.t-initialization.name = Инициализация
sector.t-initialization.description = Начальная точка. Низкий уровень угрозы и небольшое содержание ресурсов.\nЗахватите сектор и продвигайтесь дальше.
all.message = Входящее сообщение...
init.landed = Добро пожаловать на Кудол, начало нашего путешествия в TECHNOLOGIUM.
init.resources = Добудьте :t-hematite: [accent]гематит[] и :t-tin: [accent]олово[] - базовые ресурсы данной планеты.
init.power = Исследуйте :t-thermal-plate: [accent]термальную пластину[] и поставьте её на термальный камень слева от ядра.\nПроблема с энергией будет вас преследовать - это нормально.
init.hema = Автоматизация - важная часть в этом мире.\nИсследуйте :t-metallic-drill: [accent]металлическую дрель[]. Поставьте дрель на гематитовую руду.\nТранспортируйте гематит в ядро при помощи :t-metallic-conveyor: [accent]конвейеров[].
init.connect = Соедините термальную пластину и дрель при помощи :t-energetic-node: [accent]энергоузла[].
init.hemamass = Расширьте добычу. Достигните 200 гематита.
init.bore = Автоматизация добычи олова потребует другой бур: исследуйте :t-metallic-plasma-bore: [accent]плазменный бур[].
init.tin = Поставьте плазменный бур напротив стены, содержащей олово. Подключите бур энергоузлом. Проведите конвейер к ядру.
init.tinmass = Расширьте добычу. Достигните 200 олова.
init.enemies = Обнаружены неизвестные силы, движущиеся к сектору.
init.radar = Туман войны может быть раскрыт при помощи :t-radar: [accent]радара[]. Раскройте область справа от ядра.
init.defense = Этот проход - единственный путь для врагов.\nЗаблокируйте его при помощи :t-metallic-wall: [accent]стен[].
init.turrets = Для уничтожения врагов используйте турели.\nИсследуйте и поставьте 5 турелей :t-comet: [accent]Комета[].\n Данная турель требует энергию в качестве боеприпасов.
init.wave = Надвигается первая волна.
init.end = Вся важная информация была передана. Конец передачи.

sector.t-pegmatiteMountains.name = Пегматитовые горы
sector.t-pegmatiteMountains.description = Этот сектор содержит :t-pegmatite: [accent]пегматит[] в больших количествах. Начните переплавлять руды. Получите новые ресурсы. Захватите сектор.
pm.pegmatite = Получите пегматит для дальнейшего применения.
pm.furnace = Исследуйте :t-arc-furnace: [accent]Электродуговую печь[]. Она используется для переплавки базовых ресурсов в более продвинутые.
pm.smelt = Выплавьте тёмный металл и литий в печах.
pm.end = У врага множество путей к ядру. Будьте наготове. Используйте полученные ресурсы.

sector.t-noMansLand.name = Нейтральная земля
sector.t-noMansLand.description = В секторе присутствует большое обилие ресурсов. Также здесь присутствует :t-bauxite: [accent]Боксит[]. Враги будут яростно пытаться уничтожить ваше ядро.

sector.t-goldenCrater.name = Золотой кратер
sector.t-goldenCrater.description = Некогда упаший здесь метеорит образовал кратер, теперь полный лавы. В песке данного сектора были обнаружены [accent]концентрации золота[]. Изучите [accent]фильтр[] и извлеките его.