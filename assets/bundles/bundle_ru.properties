#sectors
sector.t-initialization.name = Инициализация
sector.t-initialization.description = Начальная точка амбициозного приключения на тектонической планете.\nНизкий уровень угрозы, немного ресурсов, всё что нужно.\nЗахватите сектор, исследуйте всё возможное и продвигайтесь дальше.
all.message = Входящее сообщение...
init.landed = Добро пожаловать в мир TECHNOLOGIUM. Сейчас вы будете обучены выживанию на этой планете.
init.resources = Сначала, накопайте немного \uf61c [accent]Гематита[] вместе с \uf61a [accent]Оловом[] - базовыми ресурсами данной планеты. Это займёт немного времени.
init.power = Исследуйте \uf644 [accent]Термальную пластину[] и поставьте её на \uf66b [accent]Термальный камень[]. Это ваша начальная энергия.
init.hema = Чтобы добывать гематит и другие ресурсы, вам понадобится \uf659 [accent]Металлическая дрель[].\nИсследуйте её. Поставьте дрель на гематитовую руду.\nНе забудьте изучить \uf655 [accent]Металлический конвейер[] чтобы перемещать предметы в ядро.
init.connect = Исследуйте \uf640 [accent]Энергетический узел[] и подключите термальную пластину к дрели.
init.hemamass = Расширьте добычу гематита. Достигните 200 гематита.
init.bore = Чтобы начать добывать олово, исследуйте\n\uf65b [accent]Металлический плазменный бур[].
init.tin = Поставьте бур напротив стены с оловом на ней, затем\nподключите её к термальной пластине узлами и к ядру конвейерами.
init.tinmass = Расширьте добычу олова. Достигните 200 олова.
init.enemies = Детекторы обнаружили неизвестные войска, движущиеся к сектору.
init.radar = Туман войны может быть раскрыт при помощи \uf62b [accent]Радара[]. Раскройте область справа от ядра.
init.defense = Тут есть только один проход к ядру для врагов.\nИсследуйте \uf638 [accent]Металлическую стену[] и заблокируйте его.
init.turrets = Для уничтожения врагов используйте турели.\nИсследуйте и поставьте 5 турелей \uf65d [accent]Комета[].\nОни требуют энергию, так что вам нужно их подключить.\nВы также можете поставить больше термальных пластин.
init.wave = Надвигается первая волна вражеских войск.\nДополнительная информация: ваш юнит оснащён ремонтирующим лучом.\nИспользуйте его для ремонта стен.
init.end = Расширяйте свою базу, защищайтесь против врагов. Конец передачи.

sector.t-pegmatiteMountains.name = Пегматитовые горы
sector.t-pegmatiteMountains.description = Этот сектор содержит \uf617 [accent]Пегматит[] в больших количествах. Узнайте о переплавке. Получите новые предметы. Захватите сектор.
pm.pegmatite = Получите пегматит для дальнейшего применения.
pm.furnace = Исследуйте \uf63c [accent]Электродуговую печь[]. Она потребуется для получения наиболее необходимых предметов на этой планете.
pm.smelt = Получите тёмный металл и литий, используя печь.
pm.end = На этот раз враг будет нападать со всех сторон. Приготовьтесь.\nИспользуйте полученные предметы.

sector.t-noMansLand.name = Нейтральная земля
sector.t-noMansLand.description = В секторе присутствует большая обительность ресурсов. Также здесь присутствует \uf619 [accent]Боксит[]. Враги будут яростно пытаться уничтожить ваше ядро.