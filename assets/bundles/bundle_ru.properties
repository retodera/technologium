block.t-advanced-liquid-router.description = Равномерно распределяет жидкости по всем сторонам. Более термостойкий, чем улучшенный жидкостный маршрутизатор.

block.t-advanced-liquid-bridge.name = Продвинутый жидкостный мост
block.t-advanced-liquid-bridge.description = Перемещает жидкости над постройками и поверхностью. Более термостойкий, чем улучшенный жидкостный мост.

block.t-advanced-liquid-container.name = Продвинутый жидкостный контейнер
block.t-advanced-liquid-container.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Более термостойкий, чем улучшенный жидкостный контейнер.

block.t-advanced-liquid-tank.name = Продвинутый жидкостный бак
block.t-advanced-liquid-tank.description = Хранит жидкости. Выводит жидкости по всем сторонам, как маршрутизатор. Более термостойкий, чем улучшенный жидкостный бак.

block.t-improved-liquid-sorter.name = Улучшенный жидкостный сортировщик
block.t-improved-liquid-sorter.description = Если вводимая жидкость соответствует выбранной, она проходит вперёд, иначе выводится по бокам. Это поведение можно инвертировать нажатием по блоку и затем нажатием по \uE86A.
block.t-improved-liquid-sorter.details = Абсолютно бесполезно. Ну, пока я не сделаю пластановый трубопровод и жидкостный разгрузчик.
