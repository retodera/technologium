liquid.t-liquid-plasma.name = Жидкая плазма
liquid.t-liquid-plasma.description = Экстремально горячая плазма, должна перемещаться по специально сконструированным трубопроводам, прожигает почти всё.

liquid.t-lava.name = Лава
