#sectors
sector.landing.name = Landing
sector.landing.description = The starting point of an ambicious adventure on a tectonic planet.\nLow threat level, a few resources, everything needed.\nCapture the sector, research everything possible and move on.
landing.start = Looks like you had a great landing, core isn't damaged.
landing.mine = Start with mining some [accent]Hematite[] and [accent]Tin[] - the most essential resources.\n[gray]Hematite is dark-orange, Tin is cyan.
landing.research1 = Open the [accent]Tech tree[] and research the [accent]Dark drill[] and [accent]Dark conveyor[].
landing.drill = Place the [accent]Dark drill[] on top of the [accent]Hematite ore[].
landing.power1 = Looks like the [accent]Dark drill[] doesn't work... It needs [accent]power[]...
landing.power2 = Mine manually some more, research the [accent]Thermal Plate[] and place it on top of a [accent]Thermal stone[].
landing.power3 = Now research the [accent]Energetic node[] and connect the Thermal plate to the Dark drill.
landing.research2 = Time for the wallbreaking invention: the [accent]Dark plasma bore[]! Research it in the tech tree.
landing.tin = Place the plasma bore facing against a wall that contains tin ore, then connect it using energetic nodes.
landing.conveyor = Make a conveyor line from the drill and plasma bore to the core.
landing.production = You successfully made production of essential resources. I promise, it'll get worse and worse...
landing.pegmatite = Look for nearby [accent]pegmatite[]. It's a beige stone with grey stripes on it. Once found, place a drill on top.
landing.lithium = Pegmatite contains some lithium. Place another Arc furnace and configure it to smelt pegmatite into lithium.
landing.enricher = The ways we get Dark metal and Lithium are pretty unefficient. Research the [accent]Enricher[].
landing.enriching = Enricher enriches the ore for more efficient output. You should use it more frequently.
landing.explore = Looks like you're running out of power. Time to explore for more thermal stone.
landing.exploring1 = Research the [accent]Radar[] and place it near the fog of war, then power it.
landing.exploring2 = Continue looking for thermal stones, and not only.