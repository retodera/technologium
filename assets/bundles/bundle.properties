block.t-pot.details = AND IN ANY CASE IS NOT USED FOR RP.\n\n\n\nSomebody once told me the world is gonna roll me\nI ain't the sharpest tool in the shed\nShe was looking kind of dumb with her finger and her thumb\nIn the shape of an "L" on her forehead\n\nWell, the years start comin' and they don't stop comin'\nFed to the rules and i hit the ground runnin'\nDidn't make sense not to live for fun\nYour brain gets smart but your head gets dumb\nSo much to do, so much to see\nSo what's wrong with taking the backstreets?\nYou'll never know if you don't go\nYou'll never shine if you don't glow\n\nHey now, you're an all star\nGet your game on, go play\nHey now, you're a rock star\nGet the show on, get paid\nAnd all that glitters is gold\nOnly shootin' stars break the mold\n\nIt's a cool place, and they say it gets cooler\nYou're bundled up now, wait 'til you get older\nBut the meteor men beg to differ\nJudging by the hole in the satellite picture\nThe ice we skate is gettin' pretty thin\nThe water's gettin' warm so you might as well swim\nMy world's on fire, how 'bout yours?\nThat's the way i like it and i'll never get bored\n\nHey now, you're an all star\nGet your game on, go play\nHey now, you're a rock star\nGet the show on, get paid\nAnd all that glitters is gold\nOnly shootin' stars break the mold\n\nHey now, you're an all star\nGet your game on, go play\nHey now, you're a rock star\nGet the show on, get paid\nAnd all that glitters is gold\nOnly shootin' stars break the mold\n\nSomebody once asked: "Could i spare some change for gas?\nI need to get myself away from this place"\nI said "Yep, what a concept\nI could use a little fuel myself and we could\nall use a little change"\n\nWell, the years start comin' and they don't stop comin'\nFed to the rules and i hit the ground runnin'\nDidn't make sense not to live for fun\nYour brain gets smart but your head get dumb\nSo much to do, so much to see\nSo what's wrong with taking the backstreets?\nYou'll never know if you don't go\nYou'll never shine if you don't glow\n\nHey now, you're an all star\nGet your game on, go play\nHey now, you're a rock star\nGet the show on, get paid\nAnd all that glitters is gold\nOnly shootin' stars break the mold\nAnd all that glitters is gold\nOnly shootin' stars break the mold\n\n\n\nyea, i had absolutely zero reasons to write this by hands (without ctrl+c ctrl+v whatsoever) but i still did it. it was worth it.

