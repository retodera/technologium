#units
unit.t-quant.name = Quant
unit.t-quant.description = Defends core «Torch». Swiftly builds and heals buildings. Has a healing laser.

unit.t-lonter.name = Lonter
unit.t-lonter.description = Defends core «Blaze». Quickly flies, builds and heals buildings. Has two automated healing lasers that heal buildings and units.

unit.t-cobra.name = Cobra
unit.t-cobra.description = Crawler with a sniper mount. Fear of bases with close-range turrets and/or no regenerators.

unit.t-python.name = Python
unit.t-python.description = Fires at enemy bases with salvos of artillery shells.

unit.t-blade.name = Blade
unit.t-blade.description = Shoots continuous laser that sets enemy buildings on fire.

unit.t-saber.name = Saber
unit.t-saber.description = Burns down enemy buildings with two powerful laser mounts.

unit.t-napalm.name = Napalm
unit.t-napalm.description = Charges a powerful continuous laser that sets enemy buildings on fire.

unit.t-mercury.name = Mercury
unit.t-mercury.description = Quickly flies, shoots and destroys enemy buildings and units.

unit.t-mars.name = Mars
unit.t-mars.description = Fires barrage of bullets at enemies.

unit.t-phobos.name = Phobos
unit.t-phobos.description = Fires barrage of missiles and two piercing lasers at enemies.

unit.t-monopoly.name = Monopoly
unit.t-monopoly.description = Fusion of Mono and Poly units. Has improved stats of both.

unit.t-flarerouterlegs.name = Router flare on legs
unit.t-flarerouterlegs.description = "сделайте вспышку роутер на ножках" - someone from a some Telegram server

