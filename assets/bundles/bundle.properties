unit.t-napalm.details = - \"We're out of weapons! Bring the BFG!\"\n - \"No.\"\n - \"Why?\"\n - \"I AM THE BFG.\"

unit.t-mercury.name = Mercury
unit.t-mercury.description = Quickly flies, shoots and destroys enemy buildings and units.

unit.t-mars.name = Mars
unit.t-mars.description = Fires barrage of bullets at enemies.

unit.t-phobos.name = Phobos
unit.t-phobos.description = Fires barrage of missiles and two piercing lasers at enemies.

unit.t-monopoly.name = Monopoly
unit.t-monopoly.description = Fusion of Mono and Poly units. Has improved stats of both.

unit.t-flarerouterlegs.name = Router flare on legs
unit.t-flarerouterlegs.description = "сделайте вспышку роутер на ножках" - someone from a some Telegram server

