block.t-advanced-liquid-junction.description = An intersection of two conduit lines. Receives liquids on any side and outputs to the opposite. More heat-resistant than Tin liquid junction.

block.t-advanced-liquid-router.name = Advanced liquid router
block.t-advanced-liquid-router.description = Equally distributes inputted liquids over all sides. More heat-resistant than Tin liquid router.

block.t-advanced-liquid-bridge.name = Advanced liquid bridge
block.t-advanced-liquid-bridge.description = Transports liquids over terrain and buildings. More heat-resistant than Tin liquid bridge.

block.t-advanced-liquid-container.name = Advanced liquid container
block.t-advanced-liquid-container.description = Stores liquids. Outputs liquids to all sides, similarly to a router. More heat-resistant than Tin liquid container.

block.t-advanced-liquid-tank.name = Advanced liquid tank
block.t-advanced-liquid-tank.description = Stores liquids. Outputs liquids to all sides, similarly to a router. More heat-resistant than Tin liquid tank.

block.t-improved-liquid-sorter.name = Tin liquid sorter
block.t-improved-liquid-sorter.description = If inputted liquid matches the selection, it passes forward, otherwise it is outputted to the sides. This behaviour can be inverted by pressing on the block and then on \uE86A.
block.t-improved-liquid-sorter.details = Absolutely useless. Well, before i make plastanium conduit.

block.t-improved-liquid-unloader.name = Tin liquid unloader
block.t-improved-liquid-unloader.description = Unloads the selected liquid from nearby blocks.

block.t-liquid-pump.name = Liquid pump
block.t-liquid-pump.description = Pumps and outputs liquids. Requires power.

#power
block.t-thermal-plate.name = Thermal plate
block.t-thermal-plate.description = Slowly converts heat into power.

block.t-thermal-generator.name = Thermal generator
block.t-thermal-generator.description = Converts heat into power.

block.t-lithium-combustion-chamber.name = Lithium combustion chamber
block.t-lithium-combustion-chamber.description = Uses the reaction of lithium and water to generate power.

block.t-energetic-node.name = Small power line
block.t-energetic-node.description = Receives and supplies power to all connected and adjacent block.

block.t-energetic-node-large.name = Medium power line
block.t-energetic-node-large.description = Advanced power line with more links and bigger range.

block.t-lithium-battery.name = Lithium battery
block.t-lithium-battery.description = Stores power in times of surplus and outputs in times of deficit.

block.t-large-lithium-battery.name = Large lithium battery
block.t-large-lithium-battery.description = Stores power in times of surplus and outputs in times of deficit.

block.t-cliff-thermal-plate.name = Cliff thermal plate
block.t-cliff-thermal-plate.description = New level of uselessness.

#crafting
block.t-arc-furnace.name = Arc furnace
block.t-arc-furnace.description = Smelts ore into corresponding metals.

block.t-arc-smelter.name = Arc smelter
block.t-arc-smelter.description = Smelts ore into corresponding metals. Has ability to smelt metals into alloys. More efficient than Arc furnace.

block.t-multifunctional-smelter.name = Multifunctional smelter
block.t-multifunctional-smelter.description = Enchanced and enlarged smelter. Automatically chooses a recipe out of chosen category based on input items and liquids.

block.t-item-constructor.name = Item constructor
block.t-item-constructor.description = Creates technologies out of standart items. Optionally uses water to boost efficiency.

block.t-enricher.name = Enricher
block.t-enricher.description = Revises ores into their enriched analogs.

block.t-filter.name = Filter
block.t-filter.description = Filters out contaminated liquids and minerals from liquids/powder.

block.t-packer.name = Packer
block.t-packer.description = Packs or unpacks liquids from cans.

block.t-training-center.name = Training center
block.t-training-center.description = Fills neoplasm with knowledge for further use in production. Optionally uses water to boost efficiency.
block.t-training-center.details = Recovered technology.\n\nThrough some experiments, the enemy fraction Kaut managed to make neoplasma learn. Neoplasm was integrated into simple processors, then mechanical arms, and finally, units.\n\nIt is still uncertain why neoplasm now covers the surface of Kudol.

block.t-lava-extractor.name = Lava extractor
block.t-lava-extractor.description = Enchanced enricher for extracting concentrations of metals from lava.

#defense
block.t-metallic-wall.name = Metallic wall
block.t-metallic-wall.description = A simple wall that protects structures from enemy projectiles.

block.t-metallic-wall-large.name = Large metallic wall
block.t-metallic-wall-large.description = A simple wall that protects structures from enemy projectiles.

block.t-armored-wall.name = Armored wall
block.t-armored-wall.description = A sturdy wall that protects structures from enemy projectiles. Absorbs lasers.

block.t-armored-wall-large.name = Large armored wall
block.t-armored-wall-large.description = A sturdy wall that protects structures from enemy projectiles. Absorbs lasers.

#units
block.t-unit-fabricator.name = Unit fabricator
block.t-unit-fabricator.description = Produces basic units. Output units could be used directly or moved into reconstructors.

block.t-metallic-payload-conveyor.name = Metallic payload conveyor
block.t-metallic-payload-conveyor.description = Moves payloads forwards.

block.t-large-payload-conveyor.name = Large payload conveyor
block.t-large-payload-conveyor.description = Moves payloads forwards.

block.t-unit-assembly-platform.name = Unit assembly platform
block.t-unit-assembly-platform.description = Central part of a complex multiblock construction for assembly of more powerful units.\nRequires injectors of schematic, items, liquids and payloads, and also assembly towers to function.\nItem capacity can be expanded via storage modules..

block.t-schematic-carrier.name = Schematic carrier
block.t-schematic-carrier.description = Carries all data about unit schematic. Is inserted into a schematic injector with a payload unit.

block.t-schematic-injector.name = Schematic injector
block.t-schematic-injector.description = An essential part for an assembly platform to operate. Injects schematic from connected carrier into the platform, giving instructions on the assembly.

block.t-item-injector.name = Item injector
block.t-item-injector.description = An essential part for an assembly platform to operate. Injects items into the platform.

block.t-liquid-injector.name = Liquid injector
block.t-liquid-injector.description = An essential part for an assembly platform to operate. Injects liquid into the platform.

block.t-payload-injector.name = Payload injector
block.t-payload-injector.description = An essential part for an assembly platform to operate. Injects payloads into the platform.

#effect
block.t-core-torch.name = Core: «Torch»
block.t-core-torch.description = Compact, capacious, armored core. Once destroyed, connection with the sector is lost.
block.t-core-torch.details = First iteration, out of many. Self-replicating.

block.t-core-blaze.name = Core: «Blaze»
block.t-core-blaze.description = Enchanced core. Larger, more armored and capacious than a «Torch». Additionally extracts heat, generating power.
block.t-core-blaze.details = Second iteration.

block.t-metallic-unloader.name = Metallic unloader
block.t-metallic-unloader.description = Unloads the selected item from adjacent blocks.

block.t-metallic-container.name = Metallic container
block.t-metallic-container.description = Stores a small amount of items. Expands storage when placed next to a core. Contents can be retrieved with an unloader. 

block.t-metallic-vault.name = Metallic vault
block.t-metallic-vault.description = Stores a huge amount of items. Expands storage when placed next to a core. Contents can be retrieved with an unloader.

block.t-mini-mender.name = Small mender
block.t-mini-mender.description = Slowly repairs buildings in a radius. Optionally uses dark metal to boost efficiency.

block.t-mini-shield-projector.name = Small shield projector
block.t-mini-shield-projector.description = Creates a shield around itself that protects buildings and units inside from damage. Overheats if sustains too much damage.\nOptionally uses coolant to prevent overheating. Shield generator increases shield size and health.

block.t-radar.name = Radar
block.t-radar.description = Explores the area around itself. Consumes power.

block.t-long-range-radar.name = Long-range radar
block.t-long-range-radar.description = Explores the area around itself. Has more range than a normal Radar. Consumes power.

#logic
block.t-switch.name = Switch
block.t-switch.description = Toggleable switch. It's configuration could be read and set by a processor.

block.t-message.name = Message
block.t-message.description = Stores text messages for communication between allies.\nCould store ALOT of characters.

block.t-memory-cell.name = Memory cell
block.t-memory-cell.description = Stores numerical values for processors to read.

block.t-memory-bank.name = Memory bank
block.t-memory-bank.description = Stores numerical values for processors to read. Can store 8 times more values than a Memory cell.

block.t-energetic-processor.name = Energetic processor
block.t-energetic-processor.description = Runs a sequence of logic instructions in a loop. Can control buildings and units.

block.t-plasma-processor.name = Plasma processor
block.t-plasma-processor.description = Runs a sequence of logic instructions in a loop. Can control buildings and units. Faster than Energetic processor.

block.t-gamma-processor.name = Gamma-processor
block.t-gamma-processor.description = Just like past versions, runs a sequence of logic instructions in a loop. You already know that it can control buildings and units. Faster than Plasma processor.

block.t-omega-processor.name = Omega-processor
block.t-omega-processor.description = Ultimate processor. Requires a huge amount of power to function.

block.t-borderless-display.name = Borderless display
block.t-borderless-display.description = Displays arbitrary information from processors. No borders!

block.t-mini-borderless-display.name = Compact borderless display
block.t-mini-borderless-display.description = Displays arbitrary information from processors. No borders!

block.t-string-memory-cell.name = String memory block
block.t-string-memory-cell.description = Stores string values for processors to read. Cannot be used until i make a special logic instruction.
block.t-string-memory-cell.details = I always wanted this. I wanted this for months, maybe a year or two. Finally, i got what i wanted.

