#sectors
sector.t-initialization.name = Initialization
sector.t-initialization.description = The starting point. Low threat level and low resourse content. Capture the sector and move on.
all.message = Incoming message...
init.landed = Welcome to Kudol, the start of journey in TECHNOLOGIUM.
init.resources = Mine :t-hematite: [accent]hematite[] and :t-tin: [accent]tin[] - base resources of this planet.
init.power = Research :t-thermal-plate: [accent]thermal plate[] and place it on thermal stone to the left from the core.\nPower problem will follow you - this is normal.
init.hema = Automatization is the important part in this world.\nResearch :t-metallic-drill: [accent]metallic drill[]. Place the drill on top of hematite ore.\nTransport hematite into the core with :t-metallic-conveyor: [accent]conveyors[].
init.connect = Connect thermal plate and drill with an :t-energetic-node: [accent]energy node[].
init.hemamass = Expand the production. Reach 200 hematite.
init.bore = Tin automatization will require another drill: research :t-metallic-plasma-bore: [accent]plasma bore[].
init.tin = Place plasma bore facing a wall that contains tin. Connect the bore with an energy node. Make a conveyor line to the core.
init.tinmass = Expand the production. Reach 200 tin.
init.enemies = Detected unindentified forces approaching the sector.
init.radar = Fog of war could be revealed with a :t-radar: [accent]radar[]. Reveal the area to the right from the core.
init.defense = This passage is the only way for the enemies.\nBlock it off with :t-metallic-wall: [accent]walls[].
init.turrets = For destroying enemies use turrets.\nResearch and place 5 :t-comet: [accent]Comet[] turrets.\n This turret requires power as ammo.
init.wave = The first wave is approaching.
init.end = All important info transmitted. End communication.

sector.t-pegmatiteMountains.name = Pegmatite peaks
sector.t-pegmatiteMountains.description = This sector contains [accent]pegmatite[] in huge amounts. Start smelting ores. Obtain new resources. Capture the sector.
pm.pegmatite = Obtain pegmatite for further use.
pm.furnace = Research :t-arc-furnace: [accent]Arc furnace[]. It is used for smelting base resources into more advanced ones.
pm.smelt = Smelt dark metal and lithium in furnaces.
pm.end = The enemy has multiple paths to the core. Get ready. Use obtained resources.

sector.t-noMansLand.name = No Man's Land
sector.t-noMansLand.description = This sector contains abundance of resources. [accent]Bauxite[] is also present here. Enemies will violently try to destroy your core.

sector.t-goldenCrater.name = Golden crater
sector.t-goldenCrater.description = Once fallen there meteorite formed a crater, now full of lava. In the sand of this sector were discovered [accent]concentrations of gold[]. Research the [accent]filter[] and extract it.\n\nAsteroid belt around Kudol is unstable, this sector confirms it...

sector.t-nrc.name = Neoplasm research center
sector.t-nrc.description = An ancient laboratory that was used to experiment with neoplasma, aknowledging its properties. The facility was destroyed in unknown circumstances. The only thing left - technology that survived and a small enemy base. Recover the technology, create units, destroy the base.