init.resources = First, mine some \uF619 [accent]Hematite[] along with \uF617 [accent]Tin[] - base resources of this planet. It will take some time.
init.power = Research \uF640 [accent]Thermal plate[] and place it on top of \uF666 [accent]Thermal stone[]. This is your starting power.
init.hema = To mine hematite and other resources, you'll need \uF655 [accent]Metallic drill[].\nResearch it. Place the drill on the hematite ore .\nDon't forget to research the \uF651 [accent]Metallic conveyor[] in order to transport items from the drill to the core.
init.connect = Research \uF63C [accent]Energetic node[] and connect the thermal plate to the drill.
init.hemamass = Expand the hematite production. Reach 200 hematite.
init.bore = To start mining tin, research \uF657 [accent]Metallic plasma bore[].
init.tin = Place the bore in front of the wall with tin on top, then connect it to thermal plate with nodes and to the core with conveyors.
init.tinmass = Expand the tin production. Reach 200 tin.
init.enemies = The detectors sense unknown forces coming to the sector.
init.radar = The fog of war can be revealed via \uF627 [accent]Radar[]. Reveal the area to the right of the core.
init.defense = There is only one entrance for the enemies to our core.\nResearch \uF634 [accent]Metallic wall[] and block it off.
init.turrets = In order to destroy the enemies, use turrets. Research and place 5 of \uF659 [accent]Comet[] turrets. They require power, so you'll need to connect them. You might as well place more thermal plates.
init.wave = The first wave of enemy forces is coming up.\nSome information: your unit has a healing laser.\nUse it to heal walls.
init.end = Expand your base, defend against enemies. Transmission over.

sector.t-pegmatiteMountains.name = Pegmatite mountains
sector.t-pegmatiteMountains.description = This sector contains lots of \uF614 [accent]Pegmatite[]. Learn about smelting. Acquire new items. Capture the sector.
pm.pegmatite = Mine pegmatite for further use.
pm.furnace = Research \uF638 [accent]Arc furnace[]. It's required to get the most necessary items on this planet.
pm.smelt = Produce dark metal and lithium using the furnace.
pm.end = This time the enemy will attack from all sides. Get prepared.\nUse the acquired items.