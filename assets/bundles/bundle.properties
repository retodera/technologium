block.t-metallic-wall.name = Metallic wall
block.t-metallic-wall.description = A simple wall that protects structures from enemy projectiles.

block.t-metallic-wall-large.name = Large metallic wall
block.t-metallic-wall-large.description = A simple wall that protects structures from enemy projectiles.

block.t-armored-wall.name = Armored wall
block.t-armored-wall.description = A sturdy wall that protects structures from enemy projectiles. Absorbs lasers.

block.t-armored-wall-large.name = Large armored wall
block.t-armored-wall-large.description = A sturdy wall that protects structures from enemy projectiles. Absorbs lasers.

#units
block.t-unit-fabricator.name = Unit fabricator
block.t-unit-fabricator.description = Produces basic units. Output units could be used directly or moved into reconstructors.

block.t-unit-refabricator.name = Unit refabricator
block.t-unit-refabricator.description = Upgrades inputted units to the second tier.

block.t-metallic-payload-conveyor.name = Metallic payload conveyor
block.t-metallic-payload-conveyor.description = Moves payloads forwards.

block.t-large-payload-conveyor.name = Large payload conveyor
block.t-large-payload-conveyor.description = Moves payloads forwards.

#effect
block.t-core-torch.name = Core: «Torch»
block.t-core-torch.description = Compact, capacious, armored core. Once destroyed, connection with the sector is lost.
block.t-core-torch.details = First iteration, out of many. Self-replicating.

block.t-core-blaze.name = Core: «Blaze»
block.t-core-blaze.description = Enchanced core. Larger, better armor, more capacious than a Torch.
block.t-core-blaze.details = Second iteration.

block.t-metallic-unloader.name = Metallic unloader
block.t-metallic-unloader.description = Unloads the selected item from adjacent blocks.

block.t-metallic-container.name = Metallic container
block.t-metallic-container.description = Stores a small amount of items. Expands storage when placed next to a core. Contents can be retrieved with an unloader. 

block.t-metallic-vault.name = Metallic vault
block.t-metallic-vault.description = Stores a huge amount of items. Expands storage when placed next to a core. Contents can be retrieved with an unloader.

block.t-mini-mender.name = Small mender
block.t-mini-mender.description = Slowly repairs buildings in a radius. Optionally uses dark metal to boost efficiency.

block.t-mend-projector.name = Mend projector
block.t-mend-projector.description = Repairs buildings in a radius. Optionally uses dark metal to boost efficiency.

block.t-mini-shield-projector.name = Small shield projector
block.t-mini-shield-projector.description = Creates a shield around itself that protects buildings and units inside from damage. Overheats if sustains too much damage.\nOptionally uses coolant to prevent overheating. Shield generator increases shield size and health.

block.t-radar.name = Radar
block.t-radar.description = Explores the area around itself. Consumes power.

block.t-long-range-radar.name = Long-range radar
block.t-long-range-radar.description = Explores the area around itself. Has more range than a normal Radar. Consumes power.

#logic
block.t-switch.name = Switch
block.t-switch.description = Toggleable switch. It's configuration could be read and set by a processor.

block.t-message.name = Message
block.t-message.description = Stores text messages for communication between allies.\nCould store ALOT of characters.

block.t-memory-cell.name = Memory cell
block.t-memory-cell.description = Stores numerical values for processors to read.

block.t-memory-bank.name = Memory bank
block.t-memory-bank.description = Stores numerical values for processors to read. Can store 8 times more values than a Memory cell.

block.t-energetic-processor.name = Energetic processor
block.t-energetic-processor.description = Runs a sequence of logic instructions in a loop. Can control buildings and units.

block.t-plasma-processor.name = Plasma processor
block.t-plasma-processor.description = Runs a sequence of logic instructions in a loop. Can control buildings and units. Faster than Energetic processor.

block.t-gamma-processor.name = Gamma-processor
block.t-gamma-processor.description = Just like past versions, runs a sequence of logic instructions in a loop. You already know that it can control buildings and units. Faster than Plasma processor.

block.t-omega-processor.name = Omega-processor
block.t-omega-processor.description = Ultimate processor. Requires a huge amount of power to function.

block.t-borderless-display.name = Borderless display
block.t-borderless-display.description = Displays arbitrary information from processors. No borders!

block.t-mini-borderless-display.name = Compact borderless display
block.t-mini-borderless-display.description = Displays arbitrary information from processors. No borders!

block.t-string-memory-cell.name = String memory block
block.t-string-memory-cell.description = Stores string values for processors to read. Cannot be used until i make a special logic instruction.
block.t-string-memory-cell.details = I always wanted this. I wanted this for months, maybe a year or two. Finally, i got what i wanted.

