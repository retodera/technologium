memoryblock.copy = Copy
memoryblock.paste = Paste
memoryblock.rows = Rows
memoryblock.cols = Columns

block.t-projector.name = Projector
block.t-projector.description = Projects arbitrary information from processors to a set of coordinates with configurable size of projection and display itself.
block.t-projector.details = Maybe, it's not the best idea to place lots of projectors, since they're always getting rendered wherever you are. It's made so the projection will be shown even if the projector is offsreen.

