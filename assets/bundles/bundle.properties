block.t-display.description = Displays arbitrary information from processors.

block.t-mini-display.name = Mini logic display
block.t-mini-display.description = Displays arbitrary information from processors. Miniature version.

block.t-string-memory-block.name = String memory block
block.t-string-memory-block.description = Stores string values for processors to read. Cannot be used until i make a special logic instruction.
block.t-string-memory-block.details = I always wanted this. I wanted this for months, maybe a year or two. Finally, i got what i wanted.

